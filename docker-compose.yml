# Padel Shop home lab: Odoo (ERP) + PostgreSQL + Metabase (dashboard) + n8n (automation)
# Local demo only. The passwords below are placeholders for a machine that is not exposed
# to the internet; change them before running this anywhere else.

services:
  db:
    image: postgres:16
    environment:
      - POSTGRES_DB=postgres
      - POSTGRES_USER=odoo
      - POSTGRES_PASSWORD=odoo
    volumes:
      - odoo-db-data:/var/lib/postgresql/data
    restart: unless-stopped

  odoo:
    image: odoo:18
    depends_on:
      - db
    ports:
      - "8069:8069"
    environment:
      - HOST=db
      - USER=odoo
      - PASSWORD=odoo
    volumes:
      - odoo-web-data:/var/lib/odoo
    restart: unless-stopped

  metabase:
    image: metabase/metabase:latest
    depends_on:
      - db
    ports:
      - "3000:3000"
    environment:
      - MB_DB_FILE=/metabase-data/metabase.db
    volumes:
      - metabase-data:/metabase-data
    restart: unless-stopped

  n8n:
    image: docker.n8n.io/n8nio/n8n
    depends_on:
      - db
    ports:
      - "5678:5678"
    environment:
      - GENERIC_TIMEZONE=Asia/Riyadh
      - TZ=Asia/Riyadh
      - N8N_SECURE_COOKIE=false
    volumes:
      - n8n-data:/home/node/.n8n
    restart: unless-stopped

volumes:
  odoo-db-data:
  odoo-web-data:
  metabase-data:
  n8n-data:
